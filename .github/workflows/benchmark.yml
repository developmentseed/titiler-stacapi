name: benchmark

# Triggers on pushes to main, dev and tags.
on:
  workflow_dispatch:
  push:
    branches:
    - main
    tags:
    - '*'
    paths:
      # Only run test and docker publish if some code have changed
      - 'pyproject.toml'
      - 'titiler/**'
      - '.github/workflows/benchmark.yml'
      - 'uv.lock'

  # Run tests on pull requests.
  pull_request:

env:
  LATEST_PY_VERSION: '3.14'

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Push benchmark results to gh-benchmarks branch
      pull-requests: write # Leave PR comments when benchmark regressions exceed alert threshold
    env:
      PGSTAC_VERSION: '0.9.11'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.*" 
          enable-cache: false
          python-version: ${{ env.LATEST_PY_VERSION }}
     
      - name: Install dependencies
        run: |
          uv sync
          uv pip install psycopg[pool,binary] pypgstac==${{ env.PGSTAC_VERSION }}

      - name: Launch services
        run: docker compose up -d api
        env:
          DISABLE_CACHE: TRUE
          PGSTAC_VERSION: ${{ env.PGSTAC_VERSION }}

      - name: Ingest Stac Items/Collection
        run: |
          uv run pypgstac pgready --dsn postgresql://username:password@0.0.0.0:5439/postgis
          uv run pypgstac load collections benchmark/stac/collection.json --dsn postgresql://username:password@0.0.0.0:5439/postgis --method upsert
          uv run pypgstac load items benchmark/stac/items.json --dsn postgresql://username:password@0.0.0.0:5439/postgis --method upsert

      - name: Sleep for 10 seconds
        run: sleep 10s
        shell: bash

      - name: Run Benchmark
        run: |
          uv run pytest ./benchmark/benchmarks.py --benchmark-only --benchmark-columns 'min, max, mean, median' --benchmark-json output.json

      - name: Store and benchmark result
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1
        with:
          name: TiTiler-STACapi Benchmarks
          tool: 'pytest'
          output-file-path: output.json
          alert-threshold: '130%'
          comment-on-alert: true
          fail-on-alert: false
          # GitHub API token to make a commit comment
          github-token: ${{ secrets.GITHUB_TOKEN }}
          gh-pages-branch: 'gh-benchmarks'
          # Make a commit only if main
          auto-push: ${{ github.ref == 'refs/heads/main' }}

      - name: Stop services
        run: docker compose stop
